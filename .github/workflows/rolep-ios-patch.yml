name: RoleP iOS patch verification
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag or commit to check patch compatibility against
        required: true
        default: v3.1.1
  push:
    branches: ['rolep/**']
    paths:
      - 'patches/rolep/**'
      - 'wrappers/ios/Sources/Wrapper/**'
      - 'Package.swift'
      - '.github/workflows/rolep-ios-patch.yml'
  pull_request:
    paths:
      - 'patches/rolep/**'
      - 'wrappers/ios/Sources/Wrapper/**'
      - 'Package.swift'
      - '.github/workflows/rolep-ios-patch.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
      - uses: actions/checkout@v4
        with:
          repository: zxing-cpp/zxing-cpp
          ref: ${{ inputs.upstream_ref || 'v3.1.1' }}
          path: upstream
      - name: Reapply patch and check idempotency
        run: |
          bash fork/patches/rolep/apply.sh "$GITHUB_WORKSPACE/upstream"
          bash fork/patches/rolep/apply.sh "$GITHUB_WORKSPACE/upstream"
          git -C upstream diff --check
          git -C upstream diff > "$RUNNER_TEMP/rolep-ios.patch"
          git -C upstream rev-parse HEAD > "$RUNNER_TEMP/upstream-commit.txt"
      - name: Confirm maintained fork matches the pinned baseline patch
        if: ${{ (inputs.upstream_ref || 'v3.1.1') == 'v3.1.1' }}
        run: cmp fork/wrappers/ios/Sources/Wrapper/module.modulemap upstream/wrappers/ios/Sources/Wrapper/module.modulemap
      - name: Verify fresh Swift import and package build
        run: bash fork/patches/rolep/verify.sh "$GITHUB_WORKSPACE/upstream" "$RUNNER_TEMP/rolep-ios-verification"
      - name: Build iOS library for simulator
        run: |
          cd upstream
          swift build --triple arm64-apple-ios16.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path "$RUNNER_TEMP/rolep-ios-simulator"
      - uses: actions/upload-artifact@v4
        with:
          name: rolep-ios-patch
          path: |
            ${{ runner.temp }}/rolep-ios.patch
            ${{ runner.temp }}/upstream-commit.txt
